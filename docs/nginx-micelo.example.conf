# Publicar primero TODO el nuevo frontend/dist, incluido spa.html.
# Sustituye los bloques actuales del sitio; no cargar ambos a la vez.
server {
    listen 80;
    server_name micelo.org www.micelo.org;
    return 301 https://micelo.org$request_uri;
}

server {
    listen 443 ssl;
    server_name www.micelo.org;

    # El certificado debe cubrir tambien www.micelo.org.
    ssl_certificate /etc/letsencrypt/live/micelo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micelo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://micelo.org$request_uri;
}

server {
    listen 443 ssl;
    server_name micelo.org;

    root /var/www/mice_2/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/micelo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/micelo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4002/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        return 301 https://micelo.org/$is_args$args;
    }

    location = /spa.html {
        internal;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /spa.html =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        # Normalizar solo los HTML de la aplicacion; permite google*.html.
        rewrite ^/(chiapas-por-el-clima|convocatorias|nosotros|nuestros-objetivos|familia|registro-limpieza-playas|donativos|seguridad|aviso-uso-de-imagen|aviso-de-privacidad|deslinde-de-responsabilidad|terminos-de-uso|administracion|dashboard|sign-up)\.html$ /$1 permanent;
        rewrite ^(/.+)/+$ $1 permanent;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri.html $uri/ /spa.html;
    }
}
